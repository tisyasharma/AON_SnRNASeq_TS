# Conda environment for the AON snRNA-seq pipeline.
name: aon-snrnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  # core single-cell / numerics
  - scanpy>=1.10
  - anndata>=0.10
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.11
  - scikit-learn>=1.3      # PCA + silhouette resolution selection
  - matplotlib>=3.7
  - h5py>=3.9
  - pooch>=1.7
  - leidenalg>=0.10
  - python-igraph>=0.11
  - pillow>=10
  - colorcet>=3.0          # figure-composition palettes (notebooks/08)
  - adjustText>=1.0        # non-overlapping gene labels (notebooks/08, Fig S2)
  # enrichment / stats
  - gseapy>=1.1            # GO/KEGG/Reactome over-representation (Enrichr)
  - statsmodels>=0.14
  # pipeline / notebooks
  - snakemake-minimal>=8
  - pyyaml>=6.0            # config.yaml drives notebook parameters
  - jupyter
  - nbconvert
  # R + Bioconductor for the independent DESeq2 cross-check (workflow/scripts/deseq2_crosscheck.R)
  - r-base>=4.3
  - bioconductor-deseq2
  - pip:
      - pydeseq2>=0.5      # donor-level pseudobulk DESeq2
      - decontx-python>=0.1.0
      - scrublet>=0.2.3
      - scvi-tools>=1.1     # GPU probabilistic label transfer (notebooks/07)
      - abc_atlas_access @ git+https://github.com/AllenInstitute/abc_atlas_access.git@c23bb010c9bee8796489a49cdbf1209e77e61c92  # pinned (v1.1.1)
